name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# explicitly configure permissions, in case your GITHUB_TOKEN workflow permissions are set to read-only in repository settings
permissions:
  actions: write
  contents: write # needed so CLA signatures can be committed to this repository
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional but recommended for pull_request_target from forks.
          # Create a classic PAT with repo scope and store it as CLA_ACCESS_TOKEN.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_ACCESS_TOKEN }}
        with:
          path-to-signatures: "signatures/version1/cla.json"
          path-to-document: "https://github.com/TheWootini/booklooky-official-lrs-rater/blob/main/CLA.md"
          # branch should not be protected (or allow the CLA bot to push signatures)
          branch: "main"
          allowlist: bot*,TheWootini
          create-file-commit-message: "Creating file for storing CLA Signatures"
          signed-commit-message: "CLA signed by $contributorName"
          custom-notsigned-prcomment: 'Thank you for your contribution! Before we can merge your PR, we need you to sign our Contributor License Agreement (CLA). Please comment **"I have read the CLA Document and I hereby sign the CLA"** to agree to the [CLA terms](https://github.com/TheWootini/booklooky-official-lrs-rater/blob/main/CLA.md).'
          custom-allsigned-prcomment: "All contributors have signed the CLA. Thank you!"
