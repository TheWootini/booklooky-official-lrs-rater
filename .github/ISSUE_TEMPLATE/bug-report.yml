name: Bug report
description: Something in this rater is broken
title: ''
labels: [bug]
assignees:
  - TheWootini
body:
  - type: textarea
    id: describe
    attributes:
      label: Describe the bug
      description: A clear description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: To reproduce
      description: Steps, command line, or small code sample.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node.js version, OS, and (if relevant) book title or transcript size.
  - type: textarea
    id: context
    attributes:
      label: Additional context
